version: 1
experiment: ade-bench-h0037-reference-mining-stage # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0037-reference-mining-stage # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  # SMOKE PANEL (generative lever — G8 regression panel REQUIRED):
  #   ana-eng004            FAIL  -> 🎯 target (obt_product_inventory width flip attempt)
  #   ana-eng002            PASS  -> perturbable OBT/width canary (SAME model obt_product_inventory)
  #   ana-eng002-medium     PASS  -> perturbable OBT/width canary (SAME model obt_product_inventory)
  #   ana-eng005            PASS  -> perturbable OBT/wide canary (fact_inventory warehouse layer)
  #   intercom001           FAIL  -> secondary reach-only read (Got 7)
  #   intercom003           FAIL  -> secondary reach-only read
  #   airbnb001             PASS  -> cross-family regression tripwire (airbnb)
  #   asana001              PASS  -> cross-family regression tripwire (asana)
  #   f1001                 PASS  -> cross-family regression tripwire (f1; h0023 bled this 6/6->2/6)
  #   quickbooks002         PASS  -> cross-family regression tripwire (quickbooks)
  tasks:
    - ade-bench-ana-eng004
    - ade-bench-ana-eng002
    - ade-bench-ana-eng002-medium
    - ade-bench-ana-eng005
    - ade-bench-intercom001
    - ade-bench-intercom003
    - ade-bench-airbnb001
    - ade-bench-asana001
    - ade-bench-f1001
    - ade-bench-quickbooks002
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
