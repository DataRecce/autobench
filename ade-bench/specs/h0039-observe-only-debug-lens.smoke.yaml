version: 1
experiment: ade-bench-h0039-observe-only-debug-lens # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0039-observe-only-debug-lens # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # OBSERVE-ONLY GENERATIVE stage (fires on every author/restructure/repair task) => CONTAMINATION panel: success = Got N UNCHANGED on every passer (the gate-strip held). ade-bench- prefixed (bare slugs rejected by rk run).
    # --- Got-N contamination tripwires: 1 currently-passing @baseline passer per family (must stay PASS, Got N byte-unchanged). ---
    - ade-bench-airbnb001        # passer tripwire (airbnb family)
    - ade-bench-ana-eng001       # passer tripwire (ana-eng family)
    - ade-bench-asana001         # passer tripwire (asana family)
    - ade-bench-asana003         # 2nd asana passer — asana shares the targets' authoring construct (perturbable), so carry 2 here per G8
    - ade-bench-f1007            # passer tripwire (f1 family)
    - ade-bench-quickbooks002    # passer tripwire (quickbooks family)
    # intercom supplies NO passer tripwire: all 3 intercom tasks FAIL @baseline (31/48), so the family has no @baseline passer.
    # --- fired-and-failed record-presence cells (FAIL @baseline; verify plan_review.json is present & non-empty via `test -f`; these also exercise the lens on the failers) ---
    - ade-bench-asana004         # fired-and-failed record cell (asana) — h0017 wrote the wrong grain here verbatim
    - ade-bench-intercom001      # fired-and-failed record cell (intercom) — also the only intercom-family coverage available
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
