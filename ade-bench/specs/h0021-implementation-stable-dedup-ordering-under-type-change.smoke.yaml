version: 1
experiment: ade-bench-h0021-implementation-stable-dedup-ordering-under-type-change # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0021-implementation-stable-dedup-ordering-under-type-change # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # target + within-family sentinel + G8 cross-family regression-canary panel.
         # The lever is generative (fires on every task) but a no-op unless a type-changed
         # key drives an existing dedup/ranking `order by`, so blast radius is narrow.
         # ana-eng007: target — the type-dependent dedup-ordering divergence in dim_products.
         # ana-eng007-medium: within-family sentinel (shares the bug, vague "fix it" scope;
         #   h0013 regressed it 1->3 under broad instructions) — must NOT regress.
         # G8 canary panel: one currently-passing @baseline task from each NON-target family
         #   — ana-eng001 (ana-eng), asana001 (asana), quickbooks002 (quickbooks),
         #   f1007 (f1, a non-package task to catch convention-bleed), airbnb001 (airbnb).
         #   No intercom canary possible: intercom has no passing @baseline task (001/002/003
         #   all fail), so that family cannot supply a passer (G8 should not expect one).
         # ade-bench- prefixed (bare slugs rejected by rk run).
    - ade-bench-ana-eng007
    - ade-bench-ana-eng007-medium
    - ade-bench-ana-eng001
    - ade-bench-asana001
    - ade-bench-quickbooks002
    - ade-bench-f1007
    - ade-bench-airbnb001
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
