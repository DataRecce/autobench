version: 1
experiment: ade-bench-h0057-aneng-obt-preserve-columns-and-feature-drop-keep-base-id # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0057-aneng-obt-preserve-columns-and-feature-drop-keep-base-id # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks:
    - ade-bench-ana-eng004        # Move A flip target (hist 0/23; same construct as banked ana-eng003)
    - ade-bench-quickbooks002     # Move B stabilize + h0045<->h0055 collision canary (DROP department_name, KEEP department_id)
    - ade-bench-quickbooks003     # Move B stabilize + h0045<->h0055 collision canary
    - ade-bench-ana-eng003        # must-hold base case (h0055; widened precondition must not break it)
    - ade-bench-ana-eng006        # generalization watch (mixed failure modes; not expected to flip, only not regress)
    - ade-bench-ana-eng007        # generalization watch (widened rule MAY flip)
    - ade-bench-ana-eng007-medium # generalization watch
    - ade-bench-airbnb005         # h0053/h0050 collision-pair holds
    - ade-bench-airbnb009         # h0053/h0050 collision-pair holds
    - ade-bench-f1010-medium      # banked-lever holds (exclude-pit)
    - ade-bench-f1006             # banked-lever holds (max points)
    - ade-bench-quickbooks004     # banked-lever holds (narrow toggle)
    - ade-bench-asana001          # cross-family canary
    - ade-bench-f1007             # cross-family canary
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
