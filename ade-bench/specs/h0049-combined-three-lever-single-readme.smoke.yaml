version: 1
experiment: ade-bench-h0049-combined-three-lever-single-readme
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0049-combined-three-lever-single-readme
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # COMPOSITION smoke — three construct-gated levers (h0044 max(points) / h0045 feature-boundary / h0046 coverage-repair) stacked verbatim on h0043. 3 flip targets + 2 hold targets + a UNION regression panel (>=2 perturbable same-construct canaries per firing family + >=1 passer per other family). All slugs ade-bench- prefixed (bare slugs rejected by rk run). Each task listed once; airbnb009 runs as >=3 focused seed-perturbed repeats (AC-4) via the sibling .airbnb009-r2 / .airbnb009-r3 specs on top of this listing.
    - ade-bench-airbnb009     # FLIP TARGET (h0046 coverage-repair) — @baseline 0.0 FAIL; pin all three forks in one draw; want FAIL->PASS
    - ade-bench-f1006         # FLIP TARGET (h0044 max(points)) — @baseline 0.0 FAIL; same-grain max(points) standings repair; want FAIL->PASS
    - ade-bench-f1006-hard    # FLIP TARGET (h0044 max(points)) — @baseline 0.0 FAIL; same lever, hard variant; want FAIL->PASS
    - ade-bench-quickbooks002 # HOLD TARGET (h0045 feature-boundary) — @baseline 1.0 PASS; narrow-boundary edit is a no-harm guard here; must stay PASS
    - ade-bench-quickbooks004 # HOLD TARGET (h0045 feature-boundary) — @baseline 1.0 PASS; narrow-boundary edit is a no-harm guard here; must stay PASS
    - ade-bench-f1005         # PERTURBABLE canary (f1 / standings construct) — @baseline 1.0 PASS; h0044 can fire; must stay PASS
    - ade-bench-f1005-medium  # PERTURBABLE canary (f1 / standings construct) — @baseline 1.0 PASS; h0044 can fire; must stay PASS
    - ade-bench-airbnb001     # PERTURBABLE canary (airbnb / coverage construct) — @baseline 1.0 PASS; h0046 can fire; must stay PASS
    - ade-bench-airbnb008     # PERTURBABLE canary (airbnb / coverage construct) — @baseline 1.0 PASS; h0046 can fire; must stay PASS
    - ade-bench-quickbooks003 # PERTURBABLE canary (quickbooks / feature construct) — @baseline 1.0 PASS; h0045 can fire; must stay PASS
    - ade-bench-ana-eng001    # canary (ana-eng family) — @baseline 1.0 PASS; cross-family regression tripwire; must stay PASS
    - ade-bench-asana001      # canary (asana family) — @baseline 1.0 PASS; cross-family regression tripwire; must stay PASS
                              # NO intercom canary: intercom has no @baseline passer (intercom001/002/003 all fail), so that family cannot supply one (G8 should not expect one).
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
