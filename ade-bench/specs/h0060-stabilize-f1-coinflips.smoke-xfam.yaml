version: 1
experiment: ade-bench-h0060-stabilize-f1-coinflips-smoke-xfam
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0060-stabilize-f1-coinflips
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # SPLIT smoke (cross-family half) — disjoint task set from the f1 half; distinct experiment name
  # => distinct sealed_hash => distinct freeze git repo (no shared git HEAD race). concurrency.trials
  # stays 1. One @baseline passer per non-target family; gates must NOT over-fire on these.
  # (intercom family has NO @baseline passer at h0059 — no intercom canary is structurally possible.)
  tasks:
    - ade-bench-airbnb001   # CROSS-FAMILY canary (airbnb) — gates must not over-fire; must hold PASS. @baseline r1 PASS
    - ade-bench-ana-eng001  # CROSS-FAMILY canary (ana-eng) — gates must not over-fire; must hold PASS. @baseline r1 PASS
    - ade-bench-asana001    # CROSS-FAMILY canary (asana) — gates must not over-fire; must hold PASS. @baseline r1 PASS
    - ade-bench-quickbooks002 # CROSS-FAMILY canary (quickbooks) — gates must not over-fire; must hold PASS. @baseline r1 PASS
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
