version: 1
experiment: ade-bench-h0030-implementation-grain-rowcount-reconcile-vs-parent # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0030-implementation-grain-rowcount-reconcile-vs-parent # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GENERATIVE-class lever (the grain row-count reconcile fires on every aggregate/entity model whose grain is meant to be complete over a parent key set — that covers MOST aggregate models, so smoke carries the full G8 cross-family regression panel with G8/G10 perturbable doubling on the two construct-sharing families f1 + ana-eng); ade-bench- prefixed (bare slugs rejected by rk run)
    # --- 3 grain targets (all FAIL @baseline 622bdedac572b479; want ≥1 grain-drop to flip with the parent-grained SQL visible in the commit) ---
    - ade-bench-intercom001      # TARGET — AUTO_intercom__threads_equality "Got 7" (clean child-driven grain drop, no ambiguity)
    - ade-bench-airbnb009        # TARGET — mom_agg_review_date_range "Got 1" (date-spine; complete-calendar grain)
    - ade-bench-asana004         # TARGET — AUTO_int_asana__project_user_agg_equality "Got 3" (prescription/underdetermined; flips only if solver reads grain as one-row-per-project)
    # --- G10/G8 perturbable doubling: ≥2 perturbable canaries in EACH construct-sharing family (h0012 lesson: a generative reconcile can break a DIFFERENT family member than the single canary) ---
    - ade-bench-f1001            # canary (f1, proven-fragile to figure-rewrite) — the convention-bleed tripwire; perturbable aggregate model-author
    - ade-bench-f1005            # canary (f1) — direct h0012 casualty; if a grain/count lever survives f1005 it is a meaningful safety signal
    - ade-bench-ana-eng001       # canary (ana-eng, aggregate-heavy) — perturbable: authors aggregate models the reconcile can fire on
    - ade-bench-ana-eng002       # 2nd ana-eng perturbable canary
    # --- G8 one @baseline passer per other family ---
    - ade-bench-airbnb001        # canary (airbnb family)
    - ade-bench-asana001         # canary (asana family)
    - ade-bench-quickbooks002    # canary (quickbooks family)
    # intercom supplies NO canary: intercom001/002/003 all FAIL @baseline, so the family has no passer (G8 should not expect one); intercom001 is a target here.
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
