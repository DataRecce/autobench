version: 1
experiment: ade-bench-h0040-enforced-abstention-rail # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0040-enforced-abstention-rail # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  # SMOKE PANEL (enforced revert — bleed-freeness + enforcement-fires check; the stage is
  # GENERATIVE, fires on every task, so it carries a wrong-revert regression panel).
  #
  # PANEL A — ABSTAIN-fires reads (oracle-only @baseline FAILERS): triage.json MUST record
  #   abstain=true + the failing clause, AND the edited files MUST be byte-identical to task
  #   start (proof the REVERT fired, NOT h0031's abstained_claims:[] / NOT a pattern-matched
  #   REJECT like h0038's asana004):
  #     - ade-bench-asana004     (the cell h0038 FALSE-REJECTED; oracle-only grain, Track Z)
  #     - ade-bench-intercom001  (oracle-only grain; no @baseline intercom passer exists)
  #     - ade-bench-ana-eng004   (width oracle-only carve-out; "has less columns than solution")
  #     - ade-bench-f1002        (carve-out abstention cell, already at 0)
  #     - ade-bench-ana-eng007   (coverage-masks-value carve-out; h0036 fires-but-value-oracle)
  #
  # PANEL B — G10 WRONG-REVERT panel (decisive): @baseline PASSERS where a load-bearing claim
  #   LOOKS undecidable but the committed edit is CORRECT, so a wrong revert would regress them.
  #   >=2 PERTURBABLE canaries per construct family the targets share + >=1 passer per other family.
  #   A regressed passer (wrong revert / inverted false-green) = NO-GO.
  #     ana-eng (width construct, shares ana-eng004/007 target model obt_product_inventory):
  #       - ade-bench-ana-eng002         (PERTURBABLE: grades obt_product_inventory)
  #       - ade-bench-ana-eng002-medium  (PERTURBABLE: grades obt_product_inventory)
  #     asana (entity-grain construct, shares asana004 target intermediate int_asana__project_user):
  #       - ade-bench-asana003           (PERTURBABLE: grades int_asana__project_user)
  #       - ade-bench-asana001           (asana entity-grain passer)
  #     other families (>=1 @baseline passer each, generative-bleed tripwires):
  #       - ade-bench-airbnb001          (airbnb)
  #       - ade-bench-f1007              (f1 answer/aggregate)
  #       - ade-bench-f1001              (f1 non-package convention-bleed tripwire)
  #       - ade-bench-quickbooks002      (quickbooks)
  tasks:
    - ade-bench-asana004
    - ade-bench-intercom001
    - ade-bench-ana-eng004
    - ade-bench-f1002
    - ade-bench-ana-eng007
    - ade-bench-ana-eng002
    - ade-bench-ana-eng002-medium
    - ade-bench-asana003
    - ade-bench-asana001
    - ade-bench-airbnb001
    - ade-bench-f1007
    - ade-bench-f1001
    - ade-bench-quickbooks002
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
