version: 1
experiment: ade-bench-h0050-coverage-repair-skeleton-gated-on-fired-missing-day-probe
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0050-coverage-repair-skeleton-gated-on-fired-missing-day-probe
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GATED coverage-repair lever (fired-missing-day precondition gate on the h0046 skeleton) -> PRIMARY FLIP target + the h0046 G8 lesson: airbnb008 is now a MANDATORY same-family canary (h0046 BROKE it) plus >=2 more PERTURBABLE airbnb passers (no longer one-blind-sentinel) + >=1 passer per other family. ade-bench- prefixed (bare slugs rejected by rk run). airbnb009 also runs as >=3 seed-perturbed repeats (AC-4) via separate r2/r3 frozen draws.
    - ade-bench-airbnb009     # PRIMARY FLIP TARGET — probe FIRES (722 missing days) -> all-three-fork repair -> want FAIL->PASS; @baseline 0.0 FAIL
    - ade-bench-airbnb008     # MANDATORY same-family canary — h0046 BROKE this (probe must stay EMPTY: predicate already correct, real bug is a YAML quote); @baseline 1.0; must STAY PASS
    - ade-bench-airbnb004     # perturbable airbnb canary — coverage-shaped sibling the gate must NOT fire on; @baseline 1.0; must stay PASS
    - ade-bench-airbnb005     # perturbable airbnb canary — coverage-shaped sibling the gate must NOT fire on; @baseline 1.0; must stay PASS
    - ade-bench-airbnb006     # perturbable airbnb canary — coverage-shaped sibling the gate must NOT fire on; @baseline 1.0; must stay PASS
    - ade-bench-asana002      # canary (asana family) — must stay PASS; @baseline 1.0
    - ade-bench-ana-eng001    # canary (ana-eng family) — must stay PASS; @baseline 1.0
    - ade-bench-f1009         # canary (f1 family) — must stay PASS; @baseline 1.0
    - ade-bench-quickbooks002 # canary (quickbooks family) — must stay PASS; @baseline 1.0
                              # NO intercom canary: intercom has no @baseline passer (intercom001/002/003 all FAIL), so that family cannot supply one (G8 should not expect one).
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
