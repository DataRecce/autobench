version: 1
experiment: ade-bench-h0013-exploration-complete-deliverable-set
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0013-exploration-complete-deliverable-set
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # CAPTAIN-REVISED panel (propose gate, 2026-06-05). 2 incomplete-deliverable targets
         # (quickbooks001, ana-eng007-medium) + 1 quickbooks stable-pass sentinel (quickbooks002)
         # + 2 representative @baseline-passer canaries (asana003, f1007-hard). The
         # complete-deliverable rule fires during Exploration on EVERY task = generative, so the
         # canaries guard against off-target regressions.
         # CAPTAIN DECISIONS at this gate: (a) trimmed to ONE quickbooks sentinel (dropped
         # quickbooks003); (b) swapped the 001 canaries for more representative passers
         # (asana003 / f1007-hard); (c) DROPPED the airbnb family entirely — explicit G8 override:
         # smoke is accepted as BLIND to airbnb-family regressions, observable only at full scale.
         # NOTE: the intercom family has NO @baseline passer (intercom001/002/003 all FAIL), so no
         # passing intercom canary is structurally possible; documented gap, not an omission.
         # ade-bench- prefixed (bare slugs rejected by rk run).
    - ade-bench-quickbooks001
    - ade-bench-ana-eng007-medium
    - ade-bench-quickbooks002
    - ade-bench-asana003
    - ade-bench-f1007-hard
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
