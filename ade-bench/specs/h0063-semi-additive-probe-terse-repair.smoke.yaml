version: 1
experiment: ade-bench-h0063-semi-additive-probe-terse-repair
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0063-semi-additive-probe-terse-repair
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks:
    - ade-bench-f1006          # flip-preservation target — must stay PASS, max() at grain
    - ade-bench-f1006-hard     # PRIMARY test — drifted to row_number under h0062 verbose arm
    - ade-bench-f1005          # same-family sentinel — cumulative fix, probe must resolve to max()
    - ade-bench-f1005-medium   # drifted to QUALIFY ROW_NUMBER under h0062 — second drift cell
    - ade-bench-f1001          # f1 build; gate must NOT fire — known build coin-flip (variance)
    - ade-bench-airbnb005      # additive-SUM canary — rolling-28d daily-count SUM, must stay byte-intact
    - ade-bench-airbnb001      # additive-SUM canary — monthly review COUNT, must stay byte-intact
trials: 3 # MULTI-DRAW variance probe: 3 draws per task so f1006-hard/f1005-medium
          # yield a 3-draw distribution (variance-vs-causation — a single draw can't
          # distinguish a coin-flip from causal drift; same rationale as the h0061
          # asana002 3x probe). Full spec keeps trials:1.
concurrency:
  trials: 3 # match trials for the multi-draw probe. Was 4 (the full-run default).
            # (fe30753 / PR #10 cb298b0) gives each cell its own freeze git repo at
            # <sealed_hash>/<cell_token>, so concurrent stage commits no longer race on
            # `git HEAD`. Was 1 (the pre-fix workaround for the shared-freeze-repo race).
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
