version: 1
experiment: ade-bench-h0033-implementation-model-layer-dtype-cast # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0033-implementation-model-layer-dtype-cast # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GENERATIVE-class lever (the in-place ::type cast fires on any model column the solver
         # observes to mismatch a sibling/instruction type signal — not limited to the target), so
         # per G8/G10 the smoke carries the cross-family panel with PERTURBABLE doubling on the two
         # convention-bleed families h0009 broke (f1, quickbooks). ade-bench- prefixed (bare slugs
         # rejected by rk run).
    # --- TARGET (FAIL @baseline 622bdedac572b479; want it to flip with the ::timestamp cast landing
    #     IN the committed asana__task.sql, NOT in the raw seed — the h0020 wrong-layer failure) ---
    - ade-bench-asana002        # TARGET — AUTO_asana__task_equality "Got 2"; type/representation mismatch (due_at)
    # --- G8/G10 PERTURBABLE canaries: ≥2 in EACH family the cast could over-apply to (the h0009
    #     convention-bleed families). Both are @baseline PASS and the cast can actually fire on them. ---
    - ade-bench-f1001           # canary (f1, NO package) — h0009 convention-bleed victim (6/6->2/6); the load-bearing bleed tripwire
    - ade-bench-quickbooks003   # canary (quickbooks intermediate) — h0009 same-layer trim victim (14/14->11/14); 2nd perturbable bleed tripwire
    # --- G8 one @baseline passer per other family + the asana same-family sentinel ---
    - ade-bench-airbnb001       # sentinel (airbnb family) — regression tripwire
    - ade-bench-ana-eng001      # sentinel (ana-eng family) — regression tripwire
    - ade-bench-asana001        # sentinel (asana same-family) — breaks => side effects in the target's own family
    # intercom supplies NO canary: intercom001/002/003 all FAIL @baseline, so the family has no passer (G8 should not expect one).
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
