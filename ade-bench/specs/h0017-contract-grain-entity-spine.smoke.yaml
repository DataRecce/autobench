version: 1
experiment: ade-bench-h0017-contract-grain-entity-spine # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0017-contract-grain-entity-spine # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GENERATIVE lever (fires on every author/restructure task) => 9-task captain-trimmed set: 4 grain targets + G8 cross-family regression-canary panel; ade-bench- prefixed (bare slugs rejected by rk run)
    # --- 4 grain-spine targets (all FAIL @baseline 622bdedac572b479; want to flip) ---
    - ade-bench-intercom001      # PRIMARY reachable (concrete local copy analog int_intercom__conversation_part_aggregates)
    - ade-bench-intercom002      # PRIMARY reachable
    - ade-bench-intercom003      # PRIMARY reachable
    - ade-bench-asana004         # SECONDARY/stretch (h0016-confirmed structural-refactor inert risk)
    # asana005 / asana005-hard dropped per captain (near-certain-inert structural refactors per h0016; G8 panel kept intact).
    # --- G8 cross-family regression canaries (all PASS @baseline; must stay PASS) ---
    - ade-bench-airbnb001        # canary (airbnb family)
    - ade-bench-ana-eng001       # canary (ana-eng family)
    - ade-bench-asana001         # canary / asana sentinel (asana family)
    - ade-bench-f1007            # canary (f1 family)
    - ade-bench-quickbooks002    # canary (quickbooks family)
    # intercom supplies NO canary: intercom001/002/003 all FAIL @baseline, so the family has no passer.
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
