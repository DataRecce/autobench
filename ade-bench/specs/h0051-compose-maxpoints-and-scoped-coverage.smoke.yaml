version: 1
experiment: ade-bench-h0051-compose-maxpoints-and-scoped-coverage
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0051-compose-maxpoints-and-scoped-coverage
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # COMPOSED bleed-free levers: (1) h0050 intent+probe DOUBLE-GATED scoped coverage -> flips airbnb009; (2) h0044 same-grain max(points) standings guard -> flips f1006 + f1006-hard. 3 flip targets across 2 disjoint constructs (airbnb/coverage + f1/standings). G8/G10 panel: airbnb008 MANDATORY same-family canary (h0046 BROKE it; intent gate must spare it) + >=2 PERTURBABLE airbnb passers (004/005/006, coverage-shaped) + f1 PERTURBABLE passers (f1005/f1005-medium, standings-shaped) + >=1 passer per other family. ade-bench- prefixed (bare slugs rejected by rk run). airbnb009 also runs as >=3 seed-perturbed repeats (AC-4) via separate r2/r3 frozen draws.
    - ade-bench-f1006         # FLIP TARGET (h0044 max-points) — sums standings points -> want FAIL->PASS; @baseline 0.0 FAIL
    - ade-bench-f1006-hard    # FLIP TARGET (h0044 max-points) — harder f1 standings variant -> want FAIL->PASS; @baseline 0.0 FAIL
    - ade-bench-airbnb009     # FLIP TARGET (h0050 coverage) — probe FIRES (722 missing days) -> all-three-fork repair -> want FAIL->PASS; @baseline 0.0 FAIL
    - ade-bench-airbnb008     # MANDATORY same-family canary — h0046 BROKE this (intent gate must NOT fire: real bug is a YAML quote, not completeness); @baseline 1.0; must STAY PASS
    - ade-bench-airbnb004     # perturbable airbnb canary — coverage-shaped sibling the coverage gate must NOT fire on; @baseline 1.0; must stay PASS
    - ade-bench-airbnb005     # perturbable airbnb canary — coverage-shaped sibling the coverage gate must NOT fire on; @baseline 1.0; must stay PASS
    - ade-bench-airbnb006     # perturbable airbnb canary — coverage-shaped sibling the coverage gate must NOT fire on; @baseline 1.0; must stay PASS
    - ade-bench-f1005         # perturbable f1 canary — standings-shaped sibling the max-points guard must NOT damage; @baseline 1.0; must stay PASS
    - ade-bench-f1005-medium  # perturbable f1 canary — standings-shaped sibling the max-points guard must NOT damage; @baseline 1.0; must stay PASS
    - ade-bench-quickbooks002 # hold/canary (quickbooks family) — must stay PASS; @baseline 1.0
    - ade-bench-quickbooks004 # hold/canary (quickbooks family) — must stay PASS; @baseline 1.0
    - ade-bench-asana002      # canary (asana family) — must stay PASS; @baseline 1.0
    - ade-bench-ana-eng001    # canary (ana-eng family) — must stay PASS; @baseline 1.0
                              # NO intercom canary: intercom has no @baseline passer (intercom001/002/003 all FAIL), so that family cannot supply one (G8 should not expect one).
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
