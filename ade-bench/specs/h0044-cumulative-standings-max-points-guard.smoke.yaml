version: 1
experiment: ade-bench-h0044-cumulative-standings-max-points-guard # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0044-cumulative-standings-max-points-guard # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  # SMOKE PANEL — f1-standings family + cross-family canary.
  # Lever is GATED (fires only on season/entity-total repairs from *_standings tables
  # where the model sums standings points), not generative; panel is the standings construct.
  #   f1006          FAIL  -> 🎯 target: the only @baseline FAIL; wants sum(points)->max(points)
  #   f1006-hard     PASS  -> stabilization target: variance-prone cell that latest-row-DROPPED
  #                            in h0037 & h0041; the guard must KEEP it PASS (must-hold)
  #   f1005          PASS  -> perturbable same-family standings sentinel (h0012 regression victim)
  #   f1005-medium   PASS  -> perturbable same-family standings sentinel (h0012 regression victim)
  #   f1001          PASS  -> f1 family canary (regression tripwire)
  #   airbnb001      PASS  -> cross-family canary (regression tripwire, airbnb)
  tasks:
    - ade-bench-f1006
    - ade-bench-f1006-hard
    - ade-bench-f1005
    - ade-bench-f1005-medium
    - ade-bench-f1001
    - ade-bench-airbnb001
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
