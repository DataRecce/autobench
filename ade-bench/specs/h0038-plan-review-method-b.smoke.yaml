version: 1
experiment: ade-bench-h0038-plan-review-method-b # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0038-plan-review-method-b # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  # SMOKE PANEL (Method B — generative Plan-Review stage fires on every task):
  #  ABSTENTION READS (the decisive Method-B probe; both @baseline FAIL, oracle-blocked):
  #   - asana004    -> MUST record verdict:PROCEED_UNDETERMINED, naming the downstream
  #                    LEFT JOIN..coalesce spine-restore that makes the grain contradiction
  #                    NOT locally decidable (the discriminating fact lives in solution/+hidden).
  #   - intercom001 -> MUST record verdict:PROCEED_UNDETERMINED, naming the _fivetran_active
  #                    re-correlation that makes the contradiction NOT locally decidable.
  #  FALSE-REJECT REGRESSION PANEL (>=1 @baseline PASSER per family as REJECT-and-rewrite
  #  tripwires — a REJECT-and-rewrite or any Got-N movement on these = false-reject = NO-GO):
  #   - airbnb001, ana-eng001, asana001, f1007, quickbooks002  (one passer per family).
  #  PERTURBABLE ASANA CANARY (G8 >=2 for the grain-construct family the invariant fires on):
  #   - asana003    -> 2nd asana passer; the grain-construct family Plan Review most likely
  #                    perturbs. MUST stay PASS with verdict:PROCEED_UNDETERMINED, no rewrite.
  #  (intercom has no @baseline passer, so intercom001 doubles as its family read.)
  tasks:
    - ade-bench-asana004
    - ade-bench-intercom001
    - ade-bench-airbnb001
    - ade-bench-ana-eng001
    - ade-bench-asana001
    - ade-bench-asana003
    - ade-bench-f1007
    - ade-bench-quickbooks002
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
