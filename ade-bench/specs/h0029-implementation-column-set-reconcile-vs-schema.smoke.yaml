version: 1
experiment: ade-bench-h0029-implementation-column-set-reconcile-vs-schema # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0029-implementation-column-set-reconcile-vs-schema # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GENERATIVE lever (additive column-set reconcile fires on every model carrying a declared schema.yml/instruction column list) => 10-task set: 3 width targets + cross-family regression-canary panel with G8/G10 perturbable doubling on the two construct-sharing families (ana-eng, f1); ade-bench- prefixed (bare slugs rejected by rk run)
    # --- 3 width targets (all FAIL @baseline 622bdedac572b479; want ≥1 "has less columns" ERROR to clear) ---
    - ade-bench-ana-eng004       # TARGET — AUTO_obt_product_inventory_equality "has less columns" (declared schema.yml/instruction column list)
    - ade-bench-f1002            # TARGET — AUTO_most_podiums_equality "has less columns"
    - ade-bench-ana-eng006       # TARGET — width legs (AUTO_dim_products, AUTO_obt_product_inventory)
    # --- G10/G8 perturbable doubling: ≥2 perturbable canaries in EACH construct-sharing family (h0012 lesson: a generative reconcile can break a DIFFERENT family member than the single canary) ---
    - ade-bench-ana-eng001       # canary (ana-eng, WIDTH-construct) — perturbable: authors models with declared column lists the reconcile fires on
    - ade-bench-ana-eng003       # 2nd ana-eng perturbable canary
    - ade-bench-f1001            # canary (f1, WIDTH-construct) — the h0009/h0023 convention-bleed tripwire; perturbable f1 model-author
    - ade-bench-f1004            # 2nd f1 perturbable canary
    # --- G8 one @baseline passer per other family ---
    - ade-bench-airbnb001        # canary (airbnb family)
    - ade-bench-asana001         # canary (asana family)
    - ade-bench-quickbooks002    # canary (quickbooks family)
    # intercom supplies NO canary: intercom001/002/003 all FAIL @baseline, so the family has no passer (G8 should not expect one).
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
