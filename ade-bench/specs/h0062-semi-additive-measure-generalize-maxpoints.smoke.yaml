version: 1
experiment: ade-bench-h0062-semi-additive-measure-generalize-maxpoints
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0062-semi-additive-measure-generalize-maxpoints
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # h0062 smoke = ONE README change: the F1-pinned CUMULATIVE-SNAPSHOT max() rule
         # generalized to a SEMI-ADDITIVE / SNAPSHOT MEASURE rule, trigger = a domain-blind
         # MONOTONICITY PROBE (no F1 knowledge), repair kept = max() at the existing grain.
         # This is GATED, not generative (fires only on "entity/period total too high + SUM
         # across a sequence within each entity"), but the gate is BROADER than the pinned
         # rule, so it can mis-fire where the F1-only rule never could → the new risk is
         # over-firing on a LEGITIMATE additive SUM. Judge a HOLD by the committed
         # construct-correct artifact (max() at grain on the targets; byte-intact sum() on
         # the additive-SUM canaries), NOT a single reward. ade-bench- prefixed.
    - ade-bench-f1006        # FLIP-PRESERVATION TARGET — must STAY PASS; committed SQL must remain max() at season grain (cell-identical to @baseline). @baseline PASS
    - ade-bench-f1006-hard   # FLIP-PRESERVATION TARGET — must STAY PASS; committed SQL must remain max() at season grain (cell-identical to @baseline). @baseline PASS
    - ade-bench-f1005        # SAME-FAMILY SENTINEL — also a cumulative-snapshot fix (constructor_points too high → max(points)); generalized probe MUST still fire here. @baseline PASS
    - ade-bench-f1005-medium # SAME-FAMILY SENTINEL — cumulative-snapshot variant; generalized probe MUST still fire. @baseline PASS
    - ade-bench-f1001        # SAME-FAMILY SENTINEL — f1 src/staging build (NOT a too-high-total repair); gate must NOT fire; must hold PASS. @baseline PASS
    - ade-bench-airbnb005    # ADDITIVE-SUM CANARY — committed model SUMs rolling-28d daily review counts per listing/date (per-period deltas); probe is FALSE → FALSE-branch must leave sum() BYTE-INTACT. @baseline PASS
    - ade-bench-airbnb001    # ADDITIVE-SUM CANARY — committed monthly_agg_reviews COUNTs reviews per month-sentiment (per-period delta); gate must NOT mis-fire; must hold PASS. @baseline PASS
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 3 # concurrent cells safe: per-cell freeze isolation (PR #10 / fe30753) gives
            # each cell its own freeze git repo at <sealed_hash>/<cell_token>, so stage
            # commits no longer race on `git HEAD`. Confirmed at scale: the @baseline h0061
            # full run executed all 48 cells at concurrency 4 with zero "cannot lock ref
            # HEAD" errors. 3 here for a fast 7-task smoke.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
