version: 1
experiment: ade-bench-h0058-feature-removal-keep-base-id-stabilizer
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0058-feature-removal-keep-base-id-stabilizer
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # h0058 STABILIZER smoke = the Move-B-only feature-removal keep-base-id worked example added to @baseline h0056's feature-removal block (runs/.../2c544ee929c0c02a, 35/48). Move B was VALIDATED in h0057 (qb002/003 held PASS across both 14-task smokes, byte-unchanged); it is a variance-reducer (lowers the qb002/003 over-drop PASS->FAIL rate), NOT a flip. Judge by the committed drop-department_name/keep-department_id artifact across >=2 seed-perturbed draws (AC-4), NOT a single reward. The worked example uses GENERIC identifiers only (using_feature/feature_fk_id/feature_name); the target's own department_* schema NEVER appears in the README (the h0057 leak-catch). ade-bench- prefixed (bare slugs rejected by rk run).
    - ade-bench-quickbooks002 # STABILIZE TARGET — PASS@baseline coin-flip (h0056 r1 over-dropped department_id -> "has less columns" FAIL; r2 kept it -> PASS). Want the committed drop-department_name/KEEP-department_id artifact held across >=2 draws; @baseline r2 1.0
    - ade-bench-quickbooks003 # STABILIZE TARGET — feature-removal sibling, same over-drop coin-flip. Want keep-department_id artifact held across >=2 draws; @baseline r2 1.0
    - ade-bench-quickbooks004 # MUST-HOLD — banked narrow toggle; the worked example must NOT perturb it; @baseline r2 1.0
    - ade-bench-ana-eng003    # MUST-HOLD — BUILD/RENAME preserve-columns base case (the h0045<->h0055 boundary). The feature-removal worked example must NOT over-fire on a build to over-preserve columns; @baseline r2 1.0 (OVER-FIRE TRIPWIRE)
    - ade-bench-asana001      # CROSS-FAMILY canary — known package-family coin-flip (watch, do not over-read a wobble); @baseline r2 1.0
    - ade-bench-f1007         # CROSS-FAMILY canary — stable passer tripwire; @baseline r2 1.0
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
