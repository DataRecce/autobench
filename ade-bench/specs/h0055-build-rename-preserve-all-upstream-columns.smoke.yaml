version: 1
experiment: ade-bench-h0055-build-rename-preserve-all-upstream-columns
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0055-build-rename-preserve-all-upstream-columns
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # h0055 build/rename PRESERVE-COLUMNS lever (GATED — fires only on build/create/rename tasks that do NOT remove/disable a feature and do NOT enumerate a column subset). ONE flip target: ana-eng003 (over-narrowed dim_customer to 5 of 18 upstream cols -> AUTO_dim_customer_equality "has less columns" -> want FAIL->PASS). CRITICAL collision canaries: quickbooks002/003 are the INVERSE construct (feature removal — columns SHOULD drop); they MUST stay PASS, proving the preserve-columns rule does NOT over-fire and the h0045 feature-boundary DROP still works. Plus h0052 banked flips (airbnb009/f1006/f1006-hard) must hold, and per-family canaries. ade-bench- prefixed (bare slugs rejected by rk run). ana-eng003 ~94% @baseline -> runs as >=2 seed-perturbed repeats (AC-5); judge by full-column-set artifact (AC-3) not single reward.
    - ade-bench-ana-eng003    # FLIP TARGET (h0055 preserve-columns) — narrows dim_customer to 5 of 18 upstream cols -> want FAIL->PASS; @baseline ~0.94 (near-stable passer, low headroom)
    - ade-bench-quickbooks002 # MANDATORY inverse-construct canary — feature removal: columns SHOULD drop; preserve-columns rule must NOT over-fire; @baseline 1.0; must stay PASS
    - ade-bench-quickbooks003 # MANDATORY inverse-construct canary — feature-removal-shaped sibling (h0045 construct family); rule must NOT over-fire; @baseline 1.0; must stay PASS
    - ade-bench-airbnb009     # h0052 banked flip (coverage) — must HOLD PASS (the gate must not perturb the coverage repair); @baseline 1.0; must stay PASS
    - ade-bench-f1006         # h0052 banked flip (max-points) — must HOLD PASS; @baseline 1.0; must stay PASS
    - ade-bench-f1006-hard    # h0052 banked flip (max-points, hard variant) — must HOLD PASS; @baseline 1.0; must stay PASS
    - ade-bench-ana-eng001    # same-family canary (ana-eng) — must stay PASS; @baseline 1.0
    - ade-bench-airbnb001     # cross-family canary (airbnb) — must stay PASS; @baseline 1.0
    - ade-bench-asana002      # cross-family canary (asana) — must stay PASS; @baseline 1.0
    - ade-bench-f1007         # cross-family canary (f1) — must stay PASS; @baseline 1.0
                              # NO intercom canary: intercom has no @baseline passer (intercom001/002/003 all FAIL), so that family cannot supply one.
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
