version: 1
experiment: ade-bench-h0031-dual-output-contract-arbitration # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0031-dual-output-contract-arbitration # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GENERATIVE protocol (dual-contract arbitration fires on every author/restructure + answer-style task) => 11-task set: 3 targets + cross-family regression-canary panel with G8/G10 perturbable doubling on the construct-sharing families; ade-bench- prefixed (bare slugs rejected by rk run)
    # --- 3 targets (all FAIL @baseline 622bdedac572b479; want to flip ≥1 locally-arbitrable leg) ---
    - ade-bench-ana-eng004       # TARGET — width/missing-columns (obt_product_inventory; arbitrate declared schema/instruction width; abstain if width is oracle-only)
    - ade-bench-intercom001      # TARGET — grain/missing-parent-rows (intercom__threads; arbitrate via raw parent COUNT(DISTINCT key) + sibling pattern)
    - ade-bench-f1011            # TARGET — answer-style (per-option local checks; arbitrate by disconfirming evidence, reject self-anchored completeness)
    # --- G8 cross-family regression canaries (all PASS=1.0 @baseline; must stay PASS) ---
    - ade-bench-airbnb001        # canary (airbnb family)
    - ade-bench-ana-eng001       # canary (ana-eng family) — perturbable: model-authoring task the protocol fires on
    - ade-bench-asana001         # canary (asana family) — perturbable: model-authoring task the protocol fires on
    - ade-bench-f1007            # canary (f1 family) — perturbable: authors AUTO_stg_f1_dataset__results / driver_wins_by_season
    - ade-bench-quickbooks002    # canary (quickbooks family)
    - ade-bench-f1001            # canary — non-package convention-bleed sentinel (the exact task the h0009 ungated package-fidelity rule regressed); perturbable f1 model-author
    # --- G10/G8 perturbable doubling: ≥2 perturbable canaries in EACH construct-sharing family (h0012 lesson: a generative lever can break a DIFFERENT family member than the single canary) ---
    - ade-bench-ana-eng002       # 2nd ana-eng (WIDTH-construct) canary — grades the SAME AUTO_obt_product_inventory model as target ana-eng004; the lever fires here too
    - ade-bench-asana003         # 2nd asana (GRAIN-construct) canary — grades the SAME AUTO_int_asana__project_user intermediate as the entity-grain family of target intercom001/asana
    # intercom supplies NO canary: intercom001/002/003 all FAIL @baseline, so the family has no passer (G8 should not expect one) — its construct is covered by the asana grain doublet.
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
