version: 1
experiment: ade-bench-h0054-lap-time-average-exclude-pit-stop-laps
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0054-lap-time-average-exclude-pit-stop-laps
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # h0054 lap-time EXCLUDE-pit-laps lever (precondition-GATED on "lap-time/duration average accounting for pit stops" — NOT generative; inert on every model that does not match that construct). Fork parent = @baseline h0052 (runs/.../dcb1a62ef4066133). FLIP TARGET f1010-medium (the exclude-shape artifact must land; in the h0052 single draw it already passed — f1010-medium is a ~73% cell, so smoke judges the EXCLUDE artifact reproducibility across >=2 seed-perturbed repeats, AC-3/AC-5). MUST-HOLD the h0052 banked flips (airbnb009/f1006/f1006-hard — confirm the lap-time rule does not disturb them) + per-family canaries (>=1 passer each from airbnb/asana/ana-eng/quickbooks) + a 2nd PERTURBABLE f1 canary (f1005) the lap-time lever could plausibly touch. ade-bench- prefixed (bare slugs rejected by rk run). f1010-medium also runs as >=2 seed-perturbed repeats (AC-5) via separate frozen draws the FO spins after the gate.
    - ade-bench-f1010-medium  # FLIP TARGET (h0054 lap-time exclude-pit-laps) — want the EXCLUDE artifact on every repeat (NOT subtract-duration); @baseline h0052 draw 1.0 PASS, ~73% cell — judge by committed artifact shape
    - ade-bench-f1005         # PERTURBABLE f1 canary — standings/points-shaped f1 sibling; proves the lap-time rule does not bleed onto other f1 constructs; @baseline 1.0; must stay PASS
    - ade-bench-f1006         # MUST-HOLD h0052 banked flip (max-points construct) — lap-time lever must NOT disturb it; @baseline 1.0; must stay PASS
    - ade-bench-f1006-hard    # MUST-HOLD h0052 banked flip (max-points construct, harder) — lap-time lever must NOT disturb it; @baseline 1.0; must stay PASS
    - ade-bench-f1007         # PERTURBABLE f1 canary (stable passer) — f1-family tripwire; @baseline 1.0; must stay PASS
    - ade-bench-airbnb009     # MUST-HOLD h0052 banked flip (coverage construct) — lap-time lever must NOT disturb it; @baseline 1.0; must stay PASS
    - ade-bench-airbnb001     # cross-family canary (airbnb family) — regression tripwire; @baseline 1.0; must stay PASS
    - ade-bench-asana002      # cross-family canary (asana family) — regression tripwire; @baseline 1.0; must stay PASS
    - ade-bench-ana-eng001    # cross-family canary (ana-eng family) — regression tripwire; @baseline 1.0; must stay PASS
    - ade-bench-quickbooks002 # cross-family canary (quickbooks family) — regression tripwire; @baseline 1.0; must stay PASS
                              # NO intercom canary: intercom has no @baseline passer (intercom001/002/003 all FAIL), so that family cannot supply one.
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
