version: 1
experiment: ade-bench-h0050-coverage-repair-skeleton-gated-on-fired-missing-day-probe-airbnb009-r2 # AC-4 focused reproducibility repeat (#2); distinct experiment name + distinct seed to bust the content-addressed run-dir cache (separate run-dir from the smoke-panel airbnb009 cell = repeat #1)
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: 42 # AC-4 CAS-buster: distinct seed forces a genuinely-fresh independent solver sample (the content-addressed run-dir caches identical inputs). Behaviorally still temp=0 codex; only the run identity differs.
  solver_workflow: ./solver_workflows/h0050-coverage-repair-skeleton-gated-on-fired-missing-day-probe
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # AC-4 focused single-cell reproducibility repeat (#2) — airbnb009 ONLY (the smoke panel already covers the canaries); read the gated-probe flip across >=3 draws, not one.
    - ade-bench-airbnb009     # PRIMARY FLIP TARGET — probe FIRES (722 missing days) -> all-three-fork repair -> want FAIL->PASS; @baseline 0.0 FAIL
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
