version: 1
experiment: ade-bench-h0060-stabilize-f1-coinflips-smoke-f1
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0060-stabilize-f1-coinflips
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # SPLIT smoke (f1 half) — disjoint task set from the xfam half; distinct experiment name =>
  # distinct sealed_hash => distinct freeze git repo (no shared git HEAD race). concurrency.trials
  # stays 1. Both coin-flip targets + the 3 perturbable f1 canaries the src-naming rule can fire on.
  tasks:
    - ade-bench-f1001       # STABILIZE TARGET — coin-flip (h0059 r1 PASS / r2 FAIL). src-naming rule should pin the src_<table> branch. @baseline r1 PASS
    - ade-bench-f1003-hard  # STABILIZE TARGET — coin-flip (h0059 r1 FAIL / r2 PASS). top-N tie-crosses-cutoff rule should pin the 3-answer-table branch. @baseline r1 FAIL
    - ade-bench-f1005       # PERTURBABLE f1 canary — builds src/staging models, src-naming rule CAN fire; must hold PASS. @baseline r1 PASS
    - ade-bench-f1006       # PERTURBABLE f1 canary — builds src/staging models, src-naming rule CAN fire; must hold PASS. @baseline r1 PASS
    - ade-bench-f1007       # PERTURBABLE f1 canary — builds src/staging models, src-naming rule CAN fire; must hold PASS. @baseline r1 PASS
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
