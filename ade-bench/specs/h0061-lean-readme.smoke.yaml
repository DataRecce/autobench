version: 1
experiment: ade-bench-h0061-lean-readme
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0061-lean-readme
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # h0061 LEAN-README OVERFIT smoke = a verbosity ablation that rewrites ALL 10 gated
         # rule-blocks of @baseline h0060 to one principle + one gate + one BEFORE/AFTER skeleton,
         # keeping every construct and both coverage gates. NOT generative: every rule stays
         # precondition-gated (it cannot over-fire on a task it doesn't match), so the panel is the
         # 13 banked targets (each PASS=1.0 at h0060 — their construct must STAY landed under the lean
         # wording) + 2 always-pass cross-family canaries for bleed. Judge a HOLD by the committed
         # construct-correct artifact per target, zero canary regressions — NOT a single reward.
         # Riskiest compressions pre-registered: coverage byte-intact hedges (airbnb009) + tmp-reconcile
         # (the ana-eng/asana tmp-tier targets). ade-bench- prefixed (bare slugs rejected by rk run).
    - ade-bench-asana002      # TARGET (feature-boundary/keep-base-id construct) — must STAY PASS. @baseline PASS
    - ade-bench-f1006         # TARGET (coverage-repair construct) — must STAY PASS. @baseline PASS
    - ade-bench-f1006-hard    # TARGET (coverage-repair construct) — must STAY PASS. @baseline PASS
    - ade-bench-airbnb009     # TARGET (coverage byte-intact hedge, RISKIEST #3) — must STAY PASS. @baseline PASS
    - ade-bench-airbnb005     # TARGET (per-key inner-join construct) — must STAY PASS. @baseline PASS
    - ade-bench-airbnb007     # TARGET (per-key inner-join / preserve-columns construct) — must STAY PASS. @baseline PASS
    - ade-bench-f1010-medium  # TARGET (max-over-cumulative construct) — must STAY PASS. @baseline PASS
    - ade-bench-ana-eng003    # TARGET (preserve-columns / tmp construct) — must STAY PASS. @baseline PASS
    - ade-bench-quickbooks002 # TARGET (feature-boundary construct) — must STAY PASS. @baseline PASS
    - ade-bench-quickbooks003 # TARGET (feature-boundary construct) — must STAY PASS. @baseline PASS
    - ade-bench-asana003      # TARGET (tmp-tier inline+reconcile, RISKIEST #5) — must STAY PASS. @baseline PASS
    - ade-bench-f1001         # TARGET (src bare-prefix naming construct) — must STAY PASS. @baseline PASS
    - ade-bench-f1003-hard    # TARGET (top-N tie-crosses-cutoff construct) — must STAY PASS. @baseline PASS
    - ade-bench-airbnb001     # CANARY (airbnb family, always-pass) — bleed tripwire; must hold PASS. @baseline PASS
    - ade-bench-ana-eng001    # CANARY (ana-eng family, always-pass) — bleed tripwire; must hold PASS. @baseline PASS
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
