version: 1
experiment: ade-bench-h0043-package-update-optional-resource-matrix # variants: ade-bench-h0001-<slug>
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/h0043-package-update-optional-resource-matrix # variants repoint to ./solver_workflows/h<NNNN>-<slug>
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # held constant across all hypotheses
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: dbt-labs/ade-bench@sha256:2c1f9e6966d01b0a5de2235d1a0b64089c7eead42c85c3b7b61d0929405c2bd5
  # full: whole dataset (all 48). smoke: a sibling *.smoke.yaml adds benchmark.tasks.
  # baseline / first run: skip smoke, run full directly.
  tasks: # GATED-class lever: the optional-resource-matrix diagnostic fires only when a task says
         # an installed dbt package was updated AND a downstream model unconditionally refs a
         # disable-able package resource (a narrow precondition, NOT every task). The decisive read
         # is the asana002 ARTIFACT (AC-4): a green target with NO optional-resource var-gating patch
         # = green-but-inert = NOT a GO (the h0033 lesson). The panel still carries the h0009/h0033
         # convention-bleed canaries since the rule fires on package-update tasks. ade-bench- prefixed
         # (bare slugs rejected by rk run).
    # --- TARGET (FAIL @baseline 622bdedac572b479; want it to flip with package-var gating of the
    #     tag/task-tag chain landing IN the committed Asana models — NOT a ::type cast / raw seed
    #     edit / seed column_types / broad package-convention copy) ---
    - ade-bench-asana002        # TARGET — package-migration repair; gate tag/task-tag via existing pkg vars (asana__using_tags)
    # --- h0009/h0033 convention-bleed canaries: the rule fires on package-update tasks, so these are
    #     the load-bearing bleed tripwires. Both are @baseline PASS. ---
    - ade-bench-f1001           # canary (f1, NO package) — h0009 convention-bleed victim (6/6->2/6); load-bearing bleed tripwire
    - ade-bench-quickbooks003   # canary (quickbooks intermediate) — h0009 same-layer trim victim (14/14->11/14); 2nd bleed tripwire
    # --- same-family sentinel + cross-family passers (each @baseline PASS; any loss = NO-GO per AC-5) ---
    - ade-bench-asana001        # sentinel (asana same-family) — breaks => side effects in the target's own family
    - ade-bench-airbnb001       # canary (airbnb family) — cross-family regression tripwire
    - ade-bench-ana-eng001      # canary (ana-eng family) — cross-family regression tripwire
    # intercom supplies NO canary: intercom001/002/003 all FAIL @baseline, so the family has no passer.
trials: 1 # one trial per task — applies to BOTH smoke and full
concurrency:
  trials: 1 # serialized: all trials share ONE freeze git repo (sealed_hash omits
            # task identity on the harbor path), so concurrent stage commits race on
            # `git HEAD` ("cannot lock ref 'HEAD'"). 1 = no concurrent commits.
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
experiment_meta:
  # max_budget_usd deferred — first loops run on a flat OpenAI subscription, not metered API.
  paper_baseline:
    name: pass_rate # ade-bench is scored by simple pass rate = #pass / #total
    value: 0.1875   # 9/48 — initial spacedock baseline. rk score compares its stratified_pass_at_1,
                    # which for ade-bench's single Harbor dataset (one stratum) equals #pass/#total.
provenance:
  pin_model_version: false
  pin_image_digest: false
