# ABOUTME: swe-bench-pro mechanism smoke (N=1) — Harbor published dataset ref
# ABOUTME: scale-ai/swe-bench-pro@latest (kind: harbor, task-view materializer path).
# ABOUTME: De-risks hydration + leakage-strip + solver fit + scoring end-to-end. PROVEN
# ABOUTME: 2026-06-25: dataset hydrates clean (no PKG-40 blocker), default `rk run` works
# ABOUTME: out of the box after razorback PR #26 (no --materialize copy needed). Result:
# ABOUTME: reward 1.0 on the ansible task (see docs/smoke1-2026-06-25.md). Needs working
# ABOUTME: harbor auth + Docker; freeze offline via `rk freeze --allow-missing`.
# ABOUTME: Run from swe/ after `export RAZORBACK_SPACEDOCK_PLUGIN_DIR=<repo>/spacedock`.
version: 1
experiment: swe-bench-pro-smoke1
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/swe-bench-pro-baseline
  spacedock_skill_version: "1.0.0"
  # SWE-tuned budget. The codex runtime does NOT honor a custom max_turns — only
  # 200 (the canonical default, a no-op) or None pass the codex adapter; any other
  # value raises SpacedockSolverAgentError (razorback PR #26 made that error
  # actionable). So leave max_turns at 200 and buy the "large repo + long test
  # suite" headroom via the TIMEOUTS below (harbor trial config, not codex kwargs).
  max_turns: 200
  override_timeout_sec: 5400
  max_timeout_sec: 7200
  reasoning_effort: xhigh
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: scale-ai/swe-bench-pro@latest
  # Smoke = cap to the first task (no slugs needed; the orchestrator passes
  # tasks_root and materializes views). Bump n_tasks / switch to `tasks:` or
  # `exclude_tasks:` once the mechanism is proven.
  n_tasks: 1
trials: 1
concurrency:
  trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
