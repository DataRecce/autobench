# ABOUTME: swe-bench-pro mechanism smoke (N=1) — Harbor published dataset ref
# ABOUTME: scale-ai/swe-bench-pro@latest (kind: harbor, task-view materializer path).
# ABOUTME: De-risks hydration + leakage-strip + solver fit + scoring end-to-end before any
# ABOUTME: full run. A LIVE run requires the scale-ai/swe-bench-pro harbor package to be
# ABOUTME: hydrated/checked-out first (PKG-40-style git-checkout blocker, + working harbor
# ABOUTME: auth); freeze + schema-validate work offline via `rk freeze --allow-missing`.
# ABOUTME: Run from swe/ after `export RAZORBACK_SPACEDOCK_PLUGIN_DIR=<repo>/spacedock`.
version: 1
experiment: swe-bench-pro-smoke1
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/swe-bench-pro-baseline
  spacedock_skill_version: "1.0.0"
  # SWE-tuned budget — above the 1200s codex default: large repos + long test
  # suites need more turns and a longer per-attempt/overall timeout.
  max_turns: 400
  override_timeout_sec: 5400
  max_timeout_sec: 7200
  reasoning_effort: xhigh
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor
  dataset: scale-ai/swe-bench-pro@latest
  # Smoke = cap to the first task (no slugs needed; the orchestrator passes
  # tasks_root and materializes views). Bump n_tasks / switch to `tasks:` or
  # `exclude_tasks:` once the mechanism is proven.
  n_tasks: 1
trials: 1
concurrency:
  trials: 1
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
