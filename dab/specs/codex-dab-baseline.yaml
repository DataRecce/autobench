# ABOUTME: Full DAB run on dab@1.0 via codex spacedock_solver + spacedock-readme-baseline workflow.
# ABOUTME: reasoning_effort=high; set data_root to your local dataagentbench/data checkout.
version: 1
experiment: codex-dab-baseline
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  reasoning_effort: high
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/spacedock-readme-baseline
  spacedock_skill_version: "1.0.0"
  max_turns: 200
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
  tasks:
  - agnews
  - bookreview
  - crmarenapro
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - googlelocal
  - music_brainz_20k
  - PANCANCER_ATLAS
  - PATENTS
  - stockindex
  - stockmarket
  - yelp
trials: 1
concurrency:
  trials: 4
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
