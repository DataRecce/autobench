# ABOUTME: all 12 datasets. Only trials (1->3) and concurrency.trials (2->4, a THROUGHPUT knob) change.
# ABOUTME: Purpose: separate the ~+3 README-attributable cells (PATENTS-q1/q2 + googlelocal-q2) from
# ABOUTME: the variable-band cells that landed favorably on the single full draw (dab0016/dab0017:
