# ABOUTME: dab0018 gated-dbt classifier — Gate-2 smoke. Target crmarenapro (gate FIRES, ≥3
# ABOUTME: sources → dbt) + perturbable 2-source canaries (gate must NOT fire → byte-identical
# ABOUTME: direct path). Any canary drop = a GATE-LEAK bug (dbt branch fired on a 2-source set).
version: 1
experiment: dab0018-gated-dbt-classifier
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  reasoning_effort: high
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/dab0018-gated-dbt-classifier
  spacedock_skill_version: "1.0.0"
  max_turns: 200
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
    query_mode: batch
    workspace_variant: spacedock
  tasks:
  - crmarenapro
  - yelp
  - stockmarket
  - googlelocal
  exclude_tasks:
  - agnews
  - bookreview
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - music_brainz_20k
  - PANCANCER_ATLAS
  - PATENTS
  - stockindex
trials: 1
concurrency:
  trials: 2
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
