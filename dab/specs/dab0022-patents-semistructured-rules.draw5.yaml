# ABOUTME: dab0022 5th full draw — for a DAB leaderboard aggregate of 5 draws of the cycle-3 README:
# ABOUTME: d0a6f64260336fff (first full, 1 draw) + e8ec7dd1bde26916 (confirm, 3 draws) + this (1 draw).
# ABOUTME: NOT an IV change: same cycle-3 solver README (hash b2cae85c) + reasoning_effort high + 12 datasets.
# ABOUTME: DISTINCT experiment label (…-draw5) so the job-config hash differs and it gets a FRESH run dir
# ABOUTME: (re-running the identical frozen spec would collide on the deterministic run-dir hash).
# ABOUTME: trials:1 with concurrency.trials:4 is SAFE here — one instance per dataset, no same-dataset
# ABOUTME: postgres-volume race (that race only happens with trials>1 at concurrency>1).
version: 1
experiment: dab0022-patents-semistructured-rules-draw5
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  reasoning_effort: high
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/dab0022-patents-semistructured-rules
  spacedock_skill_version: "1.0.0"
  max_turns: 200
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
    query_mode: batch
    workspace_variant: spacedock
  tasks:
  - agnews
  - bookreview
  - crmarenapro
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - googlelocal
  - music_brainz_20k
  - PANCANCER_ATLAS
  - PATENTS
  - stockindex
  - stockmarket
  - yelp
trials: 1
concurrency:
  trials: 4
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
