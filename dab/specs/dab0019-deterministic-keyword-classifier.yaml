# ABOUTME: dab0019 — deterministic keyword-anchored content classifier for label-stripped
# ABOUTME: category queries. Forks @codex-batch-baseline README; one gated analyze-stage lever.
version: 1
experiment: dab0019-deterministic-keyword-classifier
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  reasoning_effort: high
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/dab0019-deterministic-keyword-classifier
  spacedock_skill_version: "1.0.0"
  max_turns: 200
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
    query_mode: batch
    workspace_variant: spacedock
  tasks:
  - agnews
  - bookreview
  - crmarenapro
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - googlelocal
  - music_brainz_20k
  - PANCANCER_ATLAS
  - PATENTS
  - stockindex
  - stockmarket
  - yelp
trials: 1
concurrency:
  trials: 2
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
