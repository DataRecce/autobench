# ABOUTME: dab0021 SMOKE — surviving set agnews(target+observe) + bookreview/music_brainz_20k/stockindex canaries.
# ABOUTME: Gated lever; query_mode:batch + workspace_variant:spacedock, reasoning_effort:high (1-variable vs @codex-batch-baseline).
version: 1
experiment: dab0021-inference-provenance-noleak-audit
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  reasoning_effort: high
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/dab0021-inference-provenance-noleak-audit
  spacedock_skill_version: "1.0.0"
  max_turns: 200
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
    query_mode: batch
    workspace_variant: spacedock
  tasks:
  - agnews
  - bookreview
  - music_brainz_20k
  - stockindex
  exclude_tasks:
  - crmarenapro
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - googlelocal
  - PANCANCER_ATLAS
  - PATENTS
  - stockmarket
  - yelp
trials: 1
concurrency:
  trials: 2
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
