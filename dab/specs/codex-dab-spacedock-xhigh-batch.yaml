# ABOUTME: spacedock DAB FULL board at reasoning_effort=XHIGH — spacedock_solver/codex, gpt-5.5,
# ABOUTME: query_mode:batch + workspace_variant:spacedock, mirrors @codex-batch-baseline EXACTLY
# ABOUTME: (solver_workflow spacedock-readme-baseline-hostfix, max_turns 200, concurrency.trials 2)
# ABOUTME: except effort high->xhigh. 5-draw sweep leg to test the xhigh-hurts-gpt5.5 paradox at full board.
version: 1
experiment: codex-dab-spacedock-xhigh-batch
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  reasoning_effort: xhigh
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/spacedock-readme-baseline-hostfix
  spacedock_skill_version: "1.0.0"
  max_turns: 200
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
    query_mode: batch
    workspace_variant: spacedock
  tasks:
  - agnews
  - bookreview
  - crmarenapro
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - googlelocal
  - music_brainz_20k
  - PANCANCER_ATLAS
  - PATENTS
  - stockindex
  - stockmarket
  - yelp
trials: 1
concurrency:
  trials: 2
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
  path: null
