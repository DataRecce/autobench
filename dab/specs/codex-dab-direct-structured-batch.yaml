# ABOUTME: direct-structured DAB FULL board — plain codex agent (agent.kind=codex, NO solver workflow),
# ABOUTME: gpt-5.5 / reasoning_effort=high, query_mode:batch + workspace_variant:direct-structured.
# ABOUTME: The middle-harness counterpart to direct-minimal (bare) and @codex-batch-baseline (spacedock),
# ABOUTME: same model/effort — completes the 3-variant methodology sweep (minimal / structured / spacedock).
version: 1
experiment: codex-dab-direct-structured-batch
agent:
  kind: codex
  model: gpt-5.5
  reasoning_effort: high
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  override_timeout_sec: 3600
benchmark:
  kind: harbor
  dataset: dab@1.0
  plugin: dab
  plugin_args:
    hints: true
    data_root: /home/kent/dataagentbench/data
    query_mode: batch
    workspace_variant: direct-structured
  tasks:
  - agnews
  - bookreview
  - crmarenapro
  - DEPS_DEV_V1
  - GITHUB_REPOS
  - googlelocal
  - music_brainz_20k
  - PANCANCER_ATLAS
  - PATENTS
  - stockindex
  - stockmarket
  - yelp
trials: 1
concurrency:
  trials: 2
observers:
- kind: jsonl
  path: events.jsonl
- kind: stdout
  path: null
