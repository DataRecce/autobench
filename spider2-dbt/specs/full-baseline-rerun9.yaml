# ABOUTME: spider2-dbt re-run of the 9 build-failed tasks after razorback preflight fix (PR #23 + #25).
# ABOUTME: Same spider2-dbt-baseline solver + config as the full run; merges into the full board.
version: 1
experiment: spider2-dbt-full-baseline-rerun9
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/spider2-dbt-baseline
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor-local
  tasks_root: /home/kent/autobench/spider2-dbt/_views
  tasks:
    - spider2-dbt-asset001
    - spider2-dbt-atp_tour001
    - spider2-dbt-divvy001
    - spider2-dbt-nba001
    - spider2-dbt-retail001
    - spider2-dbt-synthea001
    - spider2-dbt-tpch002
    - spider2-dbt-workday001
    - spider2-dbt-workday002
trials: 1
concurrency:
  trials: 4
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
