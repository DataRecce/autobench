# ABOUTME: spider2-dbt 6-task smoke — codex spacedock_solver on ade's latest baseline README.
# ABOUTME: kind: harbor-local over pre-materialized views (the spider2-dbt@1.0 harbor download
# ABOUTME: is PKG-40-blocked; tools/package_spider2_dbt_views.py builds views from the local
# ABOUTME: Spider2 checkout). Solver = ade @baseline (h0061-lean-readme), held constant.
version: 1
experiment: spider2-dbt-smoke6
agent:
  kind: spacedock_solver
  runtime: codex
  model: gpt-5.5
  sampling:
    temperature: 0.0
    top_p: null
    seed: null
  solver_workflow: ./solver_workflows/baseline-ade-h0061
  spacedock_skill_version: "1.0.0"
  max_turns: 200
  override_timeout_sec: 2400
  max_timeout_sec: 2400
  reasoning_effort: xhigh # matches ade @baseline; held constant
  tools_allowed: []
  tools_denied: []
benchmark:
  kind: harbor-local
  tasks_root: /home/kent/autobench/spider2-dbt/_views
  tasks:
    - spider2-dbt-tpch001
    - spider2-dbt-activity001
    - spider2-dbt-xero_new001
    - spider2-dbt-chinook001
    - spider2-dbt-jira001
    - spider2-dbt-f1001
trials: 1
concurrency:
  trials: 2 # small smoke; bounded concurrency to limit local docker/duckdb pressure
observers:
  - kind: jsonl
    path: events.jsonl
  - kind: stdout
