[project]
name = "rk-monitor"
version = "0.1.0"
description = "Read-only terminal UI for watching Razorback rk run jobs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
rk-monitor = "monitor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["monitor.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
